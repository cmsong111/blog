name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE
      - plan.md
      - agent.md
      - AGENTS.md
      - writing-tone.md
      - ".agents/**"
      - ".claude/**"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Cache linkpreview
        uses: actions/cache@v5
        with:
          path: _cache
          key: linkpreview-${{ hashFiles('_posts/**', 'en/_posts/**') }}
          restore-keys: |
            linkpreview-

      - name: Build site
        run: |
          mkdir -p _cache
          # Pin the jsDelivr CDN to this exact commit (immutable cache) instead of @main
          echo "cdn: 'https://cdn.jsdelivr.net/gh/${{ github.repository }}@${{ github.sha }}'" > _config_ci.yml
          en_dest=$(mktemp -d "$RUNNER_TEMP/jekyll-en.XXXXXX")
          bundle exec jekyll build -d "$PAGES_DEST" --config _config.yml,_config_prod.yml,_config_ci.yml
          bundle exec jekyll build -d "$en_dest" --config _config.yml,_config_prod.yml,_config_ci.yml,_config_en.yml
          rsync -a --exclude='/assets/images/' --exclude='/robots.txt' --exclude='/ads.txt' "$en_dest/" "$PAGES_DEST/en/"
        env:
          JEKYLL_ENV: "production"
          PAGES_DEST: "_site${{ steps.pages.outputs.base_path }}"

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            --disable-external \
            --ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Verify multilingual output
        run: python3 tools/check-multilingual.py "$PAGES_DEST"
        env:
          PAGES_DEST: "_site${{ steps.pages.outputs.base_path }}"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
